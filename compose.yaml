services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ji
      POSTGRES_USER: ji
      POSTGRES_PASSWORD: ji
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ji_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ji -d ji"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

  api:
    profiles: ["app"]
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ji
      DB_USER: ji
      DB_PASSWORD: ji
      MAIL_MODE: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@ji.local
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Defina JWT_SECRET_BASE64 com pelo menos 32 bytes em Base64}
      JWT_ISSUER: ji-back
      JWT_AUDIENCE: ji-front
      JWT_DURATION: PT8H
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  ji_postgres_data:
