spring:
  application:
    name: ji-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ji}
    username: ${DB_USER:ji}
    password: ${DB_PASSWORD:ji}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

ji:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:no-reply@ji.local}
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER:ji-back}
      audience: ${JWT_AUDIENCE:ji-front}
      duration: ${JWT_DURATION:PT8H}
